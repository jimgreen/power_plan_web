<!doctype html>
<html lang="zh-CN" data-theme="precision-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联合规划总览大屏 - 考察站风-光-氢-储-柴联合规划系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/planning.css?v=20261127-ui-v30">
  <link rel="stylesheet" href="assets/ui-theme.css?v=20261127-ui-v30">
  <link rel="stylesheet" href="assets/scada.css?v=20261127-ui-v30">
  <script src="assets/ui-kit.js?v=20261127-ui-v30"></script>
</head>
<body class="scada-body">
  <div class="scada-shell">
    <!-- 顶栏：SCADA 精密风格，全面聚焦联合规划方案总览 -->
    <header class="topbar scada-topbar">
      <div class="scada-brand-group">
        <a class="brand scada-brand" href="index.html">风-光-氢-储-柴联合规划大屏</a>
        <span class="scada-live-pill" id="scadaPlanStatusPill" title="当前规划结果状态">
          <i class="scada-live-dot" aria-hidden="true"></i>
          <span id="scadaPlanStatusText">规划已求解</span>
        </span>
      </div>

      <div class="scada-context-controls" aria-label="规划方案与结果切换">
        <select id="scadaSchemeSelect" class="scada-select" aria-label="选择规划方案"></select>
        <select id="scadaFileSelect" class="scada-select" aria-label="选择求解结果文件"></select>
        <div class="scada-mode-switch" role="group" aria-label="大屏主视图切换">
          <button type="button" class="scada-mode-btn active" data-plan-mode="annual" aria-pressed="true">规划配置与年流</button>
          <button type="button" class="scada-mode-btn" data-plan-mode="typical" aria-pressed="false">典型日校核</button>
        </div>
        <button id="scadaFullscreenBtn" type="button" class="scada-icon-btn" title="全屏大屏模式 (F11)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
          <span>全屏</span>
        </button>
        <a class="scada-nav-link" href="index.html">系统门户</a>
      </div>

      <div class="user-status" data-auth-user hidden>
        <strong data-auth-username></strong><em data-auth-role></em>
        <button type="button" data-logout>退出</button>
      </div>
    </header>

    <!-- 单行紧凑规划核心决策指标带（34px · 图标+核心数值） -->
    <section class="scada-kpi-strip" aria-label="联合规划核心指标摘要">
      <div class="scada-kpi-item" title="规划电源总装机">
        <span class="scada-kpi-label"><span class="ui-ico ui-ico-sm ui-ico-accent" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13 2.5L5.5 13h5.5l-1 8.5L18.5 11H13l0-8.5z"/></svg></span>装机</span>
        <strong id="kpiTotalCapVal">—</strong><em class="scada-kpi-unit">kW</em>
      </div>
      <div class="scada-kpi-item" title="综合度电成本 (LCOE)">
        <span class="scada-kpi-label"><span class="ui-ico ui-ico-sm ui-ico-warn" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.5h5M9.5 13h5M12 7.5v9"/></svg></span>LCOE</span>
        <strong id="kpiLcoeVal">—</strong><em class="scada-kpi-unit">元/kWh</em>
      </div>
      <div class="scada-kpi-item" title="年均总成本">
        <span class="scada-kpi-label"><span class="ui-ico ui-ico-sm ui-ico-aurora" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19.5h16"/><rect x="6" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="7" width="3" height="10" rx="1"/><rect x="15" y="4.5" width="3" height="12.5" rx="1"/></svg></span>年成本</span>
        <strong id="kpiAnnualCostVal">—</strong><em class="scada-kpi-unit" id="kpiAnnualCostUnit">万元</em>
      </div>
      <div class="scada-kpi-item" title="年度绿电占比">
        <span class="scada-kpi-label"><span class="ui-ico ui-ico-sm ui-ico-ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19C5 10.5 10.5 5 19.5 4.5c-.5 9-6 14.5-14.5 14.5z"/><path d="M5 19l8.5-8.5"/></svg></span>绿电</span>
        <strong id="kpiGreenPct">—</strong><em class="scada-kpi-unit">%</em>
      </div>
      <div class="scada-kpi-item" title="新能源弃电率">
        <span class="scada-kpi-label"><span class="ui-ico ui-ico-sm ui-ico-warn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 8.5h11.5a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 13h15a2.5 2.5 0 1 1-2.5 2.5"/><path d="M3 17.5h8.5a2 2 0 1 1-2 2"/></svg></span>弃电</span>
        <strong id="kpiCurtailVal">—</strong><em class="scada-kpi-unit">%</em>
      </div>
      <div class="scada-kpi-item" title="频率安全边界">
        <span class="scada-kpi-label"><span class="ui-ico ui-ico-sm ui-ico-accent" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.5 12h3.2l2.3-6 3.2 12 2.6-8 1.9 2h5.8"/></svg></span>频率</span>
        <strong id="kpiFreqVal">—</strong><em class="scada-kpi-unit">Hz</em>
      </div>
      <div class="scada-kpi-item" title="供电可靠率">
        <span class="scada-kpi-label"><span class="ui-ico ui-ico-sm ui-ico-ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.6-3 8.1-7 9.5-4-1.4-7-4.9-7-9.5V6l7-3z"/><path d="M9.2 12.2l2 2 3.8-4"/></svg></span>可靠率</span>
        <strong id="kpiRelVal">—</strong><em class="scada-kpi-unit">%</em>
      </div>
      <div class="scada-kpi-item scada-kpi-alarm" id="kpiCheckSummary" title="规划校核结论">
        <span class="scada-kpi-label"><span class="ui-ico ui-ico-sm ui-ico-aurora" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3z"/></svg></span>校核</span>
        <strong id="kpiCheckStatus">—</strong>
      </div>
    </section>

    <!-- 主三栏 100vh 规划总览工作区 -->
    <main class="scada-workspace">
      <!-- 左侧规划翼：目标达成表盘 + 规划装机明细表 + 成本构成 -->
      <aside class="scada-col scada-col-left" aria-label="规划达成与装机明细">
        <section class="scada-panel scada-gauges-panel">
          <div class="scada-panel-head">
            <h2>规划目标与安全达成</h2>
            <span class="scada-tag" id="scadaStaleTag" hidden>参数已变</span>
          </div>
          <div class="scada-gauges-grid">
            <div class="scada-gauge-box">
              <svg id="scadaGreenGauge" class="scada-gauge-svg" viewBox="0 0 140 98" role="img" aria-label="年度绿电占比仪表"></svg>
            </div>
            <div class="scada-gauge-box">
              <svg id="scadaSafetyGauge" class="scada-gauge-svg" viewBox="0 0 140 98" role="img" aria-label="新能源消纳与频率安全仪表"></svg>
            </div>
          </div>
        </section>

        <section class="scada-panel scada-telemetry-panel">
          <div class="scada-panel-head">
            <h2>规划装机与年发电配置</h2>
            <span class="scada-sub-meta" id="scadaSiteLoadMeta">—</span>
          </div>
          <div id="scadaTelemetryTable" class="scada-telemetry-table"></div>
        </section>

        <section class="scada-panel scada-annual-panel scada-wx-panel">
          <div class="scada-panel-head">
            <div class="scada-subtabs" role="tablist" aria-label="气象工况与经济性切换">
              <button type="button" class="scada-subtab active" data-left-tab="weather" aria-selected="true" title="南极气象工况">气象</button>
              <button type="button" class="scada-subtab" data-left-tab="cost" aria-selected="false" title="年化经济性构成">经济</button>
            </div>
            <span class="scada-tag" id="scadaWxActiveTag" hidden>耦合推演</span>
            <a class="scada-mini-link" id="scadaLinkReport" href="report.html">简报</a>
          </div>
          <div id="scadaWeatherPane" class="scada-weather-pane" data-left-pane="weather">
            <div class="scada-wx-preset-row">
              <select id="scadaWxPreset" class="scada-wx-select" aria-label="南极典型气象工况预设">
                <option value="baseline">基准实测工况</option>
                <option value="polar_night">极夜严寒无风</option>
                <option value="katabatic_blizzard">下降风暴雪切出</option>
                <option value="polar_day">极昼高辐照满发</option>
                <option value="extreme_cold">极寒低温电池衰减</option>
                <option value="custom">自定义南极工况</option>
              </select>
              <button type="button" id="scadaWxResetBtn" class="scada-wx-mini-btn">重置</button>
            </div>
            <div class="scada-wx-controls">
              <label class="scada-wx-ctrl" title="南极环境气温偏移 (°C)">
                <span><b class="scada-wx-ctrl-lbl"><span class="ui-ico ui-ico-sm ui-ico-accent" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 14.5V5a2 2 0 0 0-4 0v9.5a3.5 3.5 0 1 0 4 0z"/><path d="M12 11v4.5"/></svg></span>气温</b><em id="wxTempVal">0°C</em></span>
                <input id="wxTempSlider" type="range" min="-30" max="15" step="1" value="0">
              </label>
              <label class="scada-wx-ctrl" title="南极风速倍率缩放">
                <span><b class="scada-wx-ctrl-lbl"><span class="ui-ico ui-ico-sm ui-ico-ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 8.5h11.5a2.5 2.5 0 1 0-2.5-2.5"/><path d="M3 13h15a2.5 2.5 0 1 1-2.5 2.5"/></svg></span>风速</b><em id="wxWindVal">1.0×</em></span>
                <input id="wxWindSlider" type="range" min="0.2" max="2.2" step="0.05" value="1.0">
              </label>
              <label class="scada-wx-ctrl" title="暴雪覆雪导致的光伏辐照衰减">
                <span><b class="scada-wx-ctrl-lbl"><span class="ui-ico ui-ico-sm ui-ico-aurora" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 15H18a3.5 3.5 0 0 0 .5-6.9A5.2 5.2 0 0 0 8.2 6.5 3.8 3.8 0 0 0 6.5 15z"/><path d="M8.5 18.5h.01M12 19.5h.01M15.5 18.5h.01"/></svg></span>覆雪</b><em id="wxSnowVal">0%</em></span>
                <input id="wxSnowSlider" type="range" min="0" max="95" step="5" value="0">
              </label>
              <label class="scada-wx-ctrl" title="风机防飞车切出保护风速阈值">
                <span><b class="scada-wx-ctrl-lbl"><span class="ui-ico ui-ico-sm ui-ico-warn" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.6-3 8.1-7 9.5-4-1.4-7-4.9-7-9.5V6l7-3z"/></svg></span>切出</b></span>
                <select id="wxCutoutSelect" class="scada-wx-cutout">
                  <option value="20">20 m/s</option>
                  <option value="22">22 m/s</option>
                  <option value="25" selected>25 m/s</option>
                  <option value="30">30 m/s</option>
                </select>
              </label>
            </div>
            <div class="scada-wx-footer">
              <span id="scadaWxCouplingSummary" class="scada-wx-impact">实测基准</span>
              <button type="button" id="scadaWxGenerateBtn" class="scada-wx-apply-btn">生成工况方案</button>
            </div>
          </div>
          <div id="scadaCostBreakdown" class="scada-cost-breakdown" data-left-pane="cost" hidden></div>
        </section>
      </aside>

      <!-- 中央 C 位：联合规划拓扑配置图 + 全年12月/典型日平衡趋势轨 -->
      <section class="scada-col scada-col-center" aria-label="微电网联合规划拓扑与能量平衡">
        <section class="scada-panel scada-mimic-panel">
          <div class="scada-panel-head scada-mimic-head">
            <div class="scada-mimic-title-wrap">
              <h2 id="scadaMimicHeading">联合规划装机配置与年度能量流拓扑 (MWh/a)</h2>
              <span class="scada-bus-badge" id="scadaBusBadge">8760h MILP 联合优化</span>
            </div>
            <div class="scada-playback-bar" id="scadaTypicalBar" hidden aria-label="典型日逐时校核回放">
              <select id="scadaDaySelect" class="scada-speed-select" aria-label="选择典型日"></select>
              <button id="scadaPlayBtn" type="button" class="scada-play-btn" aria-pressed="false">播放</button>
              <button id="scadaPrevHourBtn" type="button" class="scada-step-btn" title="上一小时">‹</button>
              <input id="scadaHourSlider" type="range" min="0" max="23" step="1" value="12" aria-label="校核时刻">
              <button id="scadaNextHourBtn" type="button" class="scada-step-btn" title="下一小时">›</button>
              <span id="scadaTimeDisplay" class="scada-time-readout">12:00</span>
            </div>
            <div class="scada-annual-legend" id="scadaAnnualLegend">
              <span><i style="background:#38BDF8"></i>风电</span>
              <span><i style="background:#FBBF24"></i>光伏</span>
              <span><i style="background:#2DD4BF"></i>电储能</span>
              <span><i style="background:#A78BFA"></i>氢储能</span>
              <span><i style="background:#FB7185"></i>柴发</span>
            </div>
          </div>

          <div class="scada-env-bar" id="scadaEnvBar" aria-label="南极气象环境与能源耦合状态"></div>

          <div class="scada-mimic-stage" id="scadaMimicStage">
            <svg id="scadaMimicSvg" class="scada-mimic-svg" viewBox="0 0 920 420" preserveAspectRatio="xMidYMid meet" role="img" aria-label="微电网联合规划拓扑图"></svg>
          </div>
        </section>

        <section class="scada-panel scada-timeline-panel">
          <div class="scada-panel-head">
            <h2 id="scadaBottomChartTitle">全年 12 月源荷季节平衡与供能结构 (MWh)</h2>
            <span class="scada-sub-meta" id="scadaDaySummary">—</span>
          </div>
          <div class="scada-timeline-stage">
            <svg id="scadaTimelineSvg" class="scada-timeline-svg" role="img" aria-label="全年供能结构与功率平衡"></svg>
            <div id="scadaTimelineTip" class="insight-tooltip" hidden></div>
          </div>
        </section>
      </section>

      <!-- 右侧规划决策翼：子系统规划详情 + 规划校核结论 + 多方案横向速览 -->
      <aside class="scada-col scada-col-right" aria-label="规划详情、校核结论与方案对比">
        <section class="scada-panel scada-inspector-panel">
          <div class="scada-panel-head">
            <h2>子系统规划配置详情</h2>
            <span class="scada-sub-meta" id="scadaInspectorCode">—</span>
          </div>
          <div id="scadaInspectorBody" class="scada-inspector-body"></div>
        </section>

        <section class="scada-panel scada-alarm-panel">
          <div class="scada-panel-head">
            <h2>规划校核与优化建议</h2>
            <a class="scada-mini-link" id="scadaLinkSens" href="sensitivity.html">扫参</a>
          </div>
          <div id="scadaReviewList" class="scada-alarm-list"></div>
        </section>

        <section class="scada-panel scada-monthly-panel scada-compare-panel">
          <div class="scada-panel-head">
            <h2>多方案 LCOE / 绿电速览</h2>
            <a class="scada-mini-link" href="comparison.html">深度对比</a>
          </div>
          <div id="scadaSchemeCompareList" class="scada-compare-list"></div>
        </section>
      </aside>
    </main>
  </div>

  <script src="assets/i18n.js?v=20261127-ui-v30"></script>
  <script src="assets/auth.js?v=20261127-ui-v30"></script>
  <script src="assets/page_state.js?v=20261127-ui-v30"></script>
  <script src="assets/chart-enhancer.js?v=20261127-ui-v30"></script>
  <script src="assets/scada.js?v=20261127-ui-v30"></script>
</body>
</html>
