<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>结果对比 - 考察站风-光-氢-储-柴联合规划系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/planning.css?v=20260530-axis-range-controls">
</head>
<body>
  <main class="planning-shell">
    <header class="topbar">
      <a class="brand" href="index.html">考察站风-光-氢-储-柴联合规划系统</a>
      <nav class="main-nav" aria-label="主功能导航">
        <a href="index.html">系统首页</a>
        <a href="planning.html">参数维护</a>
        <a href="optimize.html">规划求解</a>
        <a href="evaluation.html">方案评估</a>
        <a href="frequency.html">频率计算</a>
        <a class="active" href="comparison.html">结果对比</a>
        <a href="tasks.html">任务并发</a>
      </nav>
      <div class="user-status" data-auth-user hidden>
        <span>当前用户:</span><strong data-auth-username></strong><em data-auth-role></em>
        <button type="button" data-logout>退出</button>
      </div>
    </header>

    <section class="workspace comparison-workspace">
      <section class="comparison-panel">
        <section class="comparison-tab-bar" aria-label="结果对比标签栏">
          <div id="comparisonTabs" class="comparison-tabs" role="tablist"></div>
          <div id="comparisonResultWarnings" class="result-file-warnings comparison-result-warnings" hidden></div>
        </section>

        <section class="comparison-table-grid" aria-label="结果对比表格">
          <section class="comparison-table-card">
            <h2>规划容量对比</h2>
            <div id="capacityComparisonTable" class="data-table comparison-table"></div>
          </section>
          <div id="capacityEnergyResizeHandle" class="comparison-table-column-resize-handle" data-comparison-table-column-resize="capacity-energy" role="separator" tabindex="0" aria-label="调整规划容量和经济性指标表格宽度" aria-orientation="vertical" aria-valuenow="0"></div>
          <section class="comparison-table-card">
            <h2>经济性指标对比</h2>
            <div id="energyComparisonTable" class="data-table comparison-table"></div>
          </section>
          <div id="energySafetyResizeHandle" class="comparison-table-column-resize-handle" data-comparison-table-column-resize="energy-safety" role="separator" tabindex="0" aria-label="调整经济性指标和安全性指标表格宽度" aria-orientation="vertical" aria-valuenow="0"></div>
          <section class="comparison-table-card">
            <h2>安全性指标对比</h2>
            <div id="safetyComparisonTable" class="data-table comparison-table"></div>
          </section>
        </section>

        <div id="comparisonTableCurveResizeHandle" class="comparison-table-curve-resize-handle" role="separator" tabindex="0" aria-label="调整对比表格和曲线板高度" aria-orientation="horizontal" aria-valuemin="220" aria-valuemax="760" aria-valuenow="0"></div>

        <section class="comparison-curve-board" aria-label="小时级曲线、日级统计、安全日曲线、月度统计和年度统计对比">
          <aside class="comparison-curve-list-panel">
            <div class="comparison-curve-title">小时级曲线</div>
            <span hidden>日级统计 安全日曲线 月度统计 年度统计</span>
            <div id="curveNameList" class="comparison-curve-name-list" role="listbox" aria-label="小时级曲线、日级统计、安全日曲线、月度统计和年度统计名称"></div>
          </aside>
          <section class="comparison-curve-chart-panel">
            <div id="comparisonCurveChart" class="comparison-curve-chart"></div>
          </section>
        </section>
      </section>
    </section>
  </main>
  <script src="assets/i18n.js?v=20260518-fit-text4"></script>
  <script src="assets/auth.js?v=20260510-auth"></script>
  <script src="assets/result_curves.js?v=20260530-axis-range-controls"></script>
  <script src="assets/comparison.js?v=20260530-axis-range-controls"></script>
</body>
</html>
