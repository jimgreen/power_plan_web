<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>考察站风-光-氢-储-柴联合规划系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/planning.css?v=20260601-time-table-compact-3dp">
</head>
<body>
  <main class="planning-shell">
    <header class="topbar">
      <a class="brand" href="index.html">考察站风-光-氢-储-柴联合规划系统</a>
      <nav class="main-nav" aria-label="主功能导航">
        <a href="index.html">系统首页</a>
        <a class="active" href="planning.html">参数维护</a>
        <a href="optimize.html">规划求解</a>
        <a href="evaluation.html">方案评估</a>
        <a href="frequency.html">频率计算</a>
        <a href="comparison.html">结果对比</a>
        <a href="tasks.html">任务并发</a>
      </nav>
      <div class="user-status" data-auth-user hidden>
        <span>当前用户:</span><strong data-auth-username></strong><em data-auth-role></em>
        <button type="button" data-logout>退出</button>
      </div>
    </header>

    <section class="workspace">
      <aside class="scheme-rail">
        <div class="planning-scheme-rail-layout">
          <div class="scheme-actions scheme-actions-rail scheme-actions-rail-top" aria-label="方案创建与删除">
            <button id="createScheme" type="button">新建方案</button>
            <button id="deleteScheme" class="danger" type="button">删除方案</button>
          </div>
          <div class="scheme-list-title">方案列表</div>
          <div id="schemeList" class="scheme-list"></div>
          <div class="scheme-actions scheme-actions-rail scheme-actions-rail-bottom" aria-label="方案复制与改名">
            <button id="renameScheme" type="button">修改名称</button>
            <button id="copyScheme" type="button">复制方案</button>
          </div>
        </div>
      </aside>
      <div id="schemeListResizeHandle" class="scheme-list-resize-handle" role="separator" tabindex="0" aria-label="调整方案列表高度" aria-orientation="horizontal" aria-valuemin="150" aria-valuemax="600" aria-valuenow="0"></div>

      <section class="editor-panel">
        <div class="editor-header">
          <div class="optimization-command-card planning-command-card">
            <div class="current-scheme-panel">
              <div class="current-scheme" aria-live="polite">
                <span>当前:</span>
                <strong id="currentSchemeName">未选择方案</strong>
              </div>
            </div>
            <div class="tabs" role="tablist" aria-label="参数维护标签">
              <button class="tab active" data-tab="time" type="button">时序数据</button>
              <button class="tab" data-tab="devices" type="button">设备参数</button>
              <button class="tab" data-tab="planning" type="button">规划参数</button>
              <button class="tab" data-tab="limits" type="button">方案概览</button>
            </div>
            <div class="scheme-actions" aria-label="方案操作">
              <button id="saveScheme" class="primary" type="button">保存方案</button>
            </div>
          </div>
        </div>

        <section id="timeTab" class="tab-panel active">
          <div class="chart-card">
            <div class="time-chart-toolbar">
              <div class="weather-import-bar" aria-label="历史气象数据获取">
                <button id="importTimeSeriesFile" type="button">文件导入</button>
                  <button id="openCurveGenerator" type="button">曲线生成</button>
                <button id="openCoordinatePicker" type="button">坐标选择</button>
              </div>
              <div class="curve-switch-row" aria-label="曲线切换显示">
                <div class="curve-buttons">
                  <button type="button" data-curve="wind_speed" class="curve-button active" aria-pressed="true">风速</button>
                  <button type="button" data-curve="solar_irradiance" class="curve-button" aria-pressed="false">太阳辐照</button>
                  <button type="button" data-curve="temperature" class="curve-button" aria-pressed="false">环境温度</button>
                  <button type="button" data-curve="load" class="curve-button" aria-pressed="false">负荷</button>
                </div>
                <div id="timeChartRange" class="time-chart-range" aria-label="时序曲线时间范围筛选">
                  <div class="time-chart-range-scope" role="group" aria-label="时序曲线时间范围">
                    <button type="button" data-time-chart-scope="year" class="active" aria-pressed="true">全年</button>
                    <button type="button" data-time-chart-scope="month" aria-pressed="false">指定月</button>
                    <button type="button" data-time-chart-scope="day" aria-pressed="false">指定日</button>
                  </div>
                  <label>月份<select id="timeChartMonth"></select></label>
                  <label>日期<select id="timeChartDay"></select></label>
                </div>
              </div>
            </div>
            <svg id="timeChart" class="time-chart" role="img" aria-label="风光温荷时序曲线"></svg>
            <div id="chartTip" class="chart-tip" hidden></div>
          </div>

          <div id="timeSeriesImportModal" class="map-picker-modal" hidden>
            <div class="map-picker-dialog time-series-import-dialog" role="dialog" aria-modal="true" aria-labelledby="timeSeriesImportTitle" aria-describedby="timeSeriesImportHint">
              <div class="map-picker-head">
                <h2 id="timeSeriesImportTitle">导入曲线</h2>
                <div class="coordinate-header-actions">
                  <button id="confirmTimeSeriesImport" class="primary" type="button">确认</button>
                  <button id="closeTimeSeriesImport" type="button" aria-label="取消导入曲线">取消</button>
                </div>
              </div>
              <div class="time-series-import-toolbar">
                <button id="openTimeSeriesImportFile" type="button">打开文件</button>
                <input id="timeSeriesImportFile" type="file" accept=".csv,.xlsx" hidden>
                <span id="timeSeriesImportHint" role="status" aria-live="polite">请选择包含风速、太阳辐射、环境温度、负荷的 Excel 或 CSV 文件。</span>
              </div>
              <div class="time-series-import-chart-panel">
                <div class="time-series-import-chart-head">
                  <strong>曲线预览</strong>
                  <div class="time-series-import-curve-toggles" aria-label="导入曲线显示切换">
                    <button type="button" class="time-series-import-curve-toggle active" data-import-curve="wind_speed" aria-pressed="true">风速</button>
                    <button type="button" class="time-series-import-curve-toggle active" data-import-curve="solar_irradiance" aria-pressed="true">太阳辐射</button>
                    <button type="button" class="time-series-import-curve-toggle active" data-import-curve="temperature" aria-pressed="true">环境温度</button>
                    <button type="button" class="time-series-import-curve-toggle active" data-import-curve="load" aria-pressed="true">负荷</button>
                  </div>
                </div>
                <svg id="timeSeriesImportChart" class="time-series-import-chart" role="img" aria-label="导入曲线预览"></svg>
              </div>
              <div id="timeSeriesImportResizeHandle" class="time-series-import-resize-handle" role="separator" aria-orientation="horizontal" aria-label="调整导入曲线预览高度" tabindex="0"></div>
              <div id="timeSeriesImportPreview" class="data-table time-series-import-preview">
                <div class="empty-summary">打开文件后，在这里预览8760点曲线。</div>
              </div>
              <div class="map-picker-foot">
                <span id="timeSeriesImportSummary">未选择文件</span>
              </div>
            </div>
          </div>

          <div id="loadGeneratorModal" class="map-picker-modal" hidden>
            <div class="map-picker-dialog load-generator-dialog" role="dialog" aria-modal="true" aria-labelledby="loadGeneratorTitle" aria-describedby="loadGeneratorHint">
              <div class="map-picker-head">
                <h2 id="loadGeneratorTitle">曲线生成</h2>
                <div class="coordinate-header-actions">
                  <button id="confirmLoadGenerator" class="primary" type="button">确认</button>
                  <button id="closeLoadGenerator" type="button" aria-label="取消曲线生成">取消</button>
                </div>
              </div>
              <div id="curveGeneratorTabs" class="curve-generator-tabs" role="tablist" aria-label="生成曲线类型">
                <button class="curve-generator-tab active" type="button" role="tab" aria-selected="true" data-curve-generator-target="wind_speed">风速</button>
                <button class="curve-generator-tab" type="button" role="tab" aria-selected="false" data-curve-generator-target="solar_irradiance">光照辐射</button>
                <button class="curve-generator-tab" type="button" role="tab" aria-selected="false" data-curve-generator-target="load">负荷</button>
              </div>
              <div class="load-generator-grid">
                <label>指定模式
                  <select id="loadGeneratorMode">
                    <option value="random">随机曲线</option>
                    <option value="file">文件导入</option>
                  </select>
                </label>
                <label><span id="loadGeneratorMaxLabel">负荷最大值</span><input id="loadGeneratorMax" type="number" min="0" step="any"></label>
                <label><span id="loadGeneratorMinLabel">负荷最小值</span><input id="loadGeneratorMin" type="number" min="0" step="any"></label>
                <label><span id="loadGeneratorAverageLabel">负荷平均值</span><input id="loadGeneratorAverage" type="number" min="0" step="any"></label>
              </div>
              <svg id="loadGeneratorPreview" class="load-generator-preview" role="img" aria-label="生成负荷曲线预览"></svg>
              <div class="map-picker-foot">
                <span id="loadGeneratorHint">输入最大值、最小值、平均值，并选择生成模式。</span>
                <button id="generateLoadCurve" type="button">生成负荷曲线</button>
                <input id="loadCurveImportFile" type="file" accept=".csv,.xlsx" hidden>
                <button id="saveLoadTemplate" type="button">保存模板</button>
              </div>
            </div>
          </div>

          <div id="mapPickerModal" class="map-picker-modal" hidden>
            <div class="map-picker-dialog coordinate-picker-dialog" role="dialog" aria-modal="true" aria-labelledby="mapPickerTitle" aria-describedby="mapPickerHint">
              <div class="map-picker-head">
                <h2 id="mapPickerTitle">坐标选择</h2>
                <div class="coordinate-header-actions">
                  <button id="confirmMapPoint" class="primary" type="button">确认</button>
                  <button id="closeMapPicker" type="button" aria-label="取消坐标选择">取消</button>
                </div>
              </div>
              <div class="coordinate-control-row">
                <div class="coordinate-search-row">
                  <label>地名<input id="weatherPlace" type="text" placeholder="例如：上海"></label>
                  <button id="geocodePlace" type="button">定位</button>
                </div>
                <div class="coordinate-weather-row" aria-label="气象数据坐标与年份">
                  <label>纬度<input id="weatherLatitude" type="number" min="-90" max="90" step="0.001" placeholder="-90 到 90"></label>
                  <label>经度<input id="weatherLongitude" type="number" min="-180" max="180" step="0.001" placeholder="-180 到 180"></label>
                  <label>年份<input id="weatherYear" type="number" min="2001" step="1" value="2024" placeholder="当前年之前"></label>
                  <button id="fetchWeatherHistory" class="primary" type="button">气象获取</button>
                  <span id="weatherImportStatus" class="weather-import-status" role="status" aria-live="polite"></span>
                </div>
              </div>
              <div class="map-provider-tabs" role="tablist" aria-label="地图接口切换">
                <button class="map-provider-tab active" type="button" data-map-provider="amap" aria-selected="true">高德地图</button>
                <button class="map-provider-tab" type="button" data-map-provider="osm" aria-selected="false">OpenStreetMap</button>
              </div>
              <div id="mapPickerHint" class="coordinate-map-hint">根据地名查找坐标，或点击地图选点。</div>
              <div id="mapPickerCanvas" class="map-picker-canvas"></div>
              <div id="weatherPreviewResizeHandle" class="weather-preview-resize-handle" role="separator" aria-orientation="horizontal" aria-label="调整地图与气象曲线高度" tabindex="0"></div>
              <div class="weather-preview-panel">
                <div class="weather-preview-head">
                  <strong>气象曲线预览</strong>
                  <div class="weather-preview-legend" aria-label="气象曲线显示切换">
                    <button type="button" class="weather-preview-legend-item active" data-weather-preview-curve="wind_speed" aria-pressed="true"><span style="--curve-color:#21d5ff"></span>风速</button>
                    <button type="button" class="weather-preview-legend-item active" data-weather-preview-curve="solar_irradiance" aria-pressed="true"><span style="--curve-color:#ffd166"></span>太阳辐射</button>
                    <button type="button" class="weather-preview-legend-item active" data-weather-preview-curve="temperature" aria-pressed="true"><span style="--curve-color:#b292ff"></span>环境温度</button>
                  </div>
                </div>
                <svg id="weatherPreviewChart" class="weather-preview-chart" role="img" aria-label="气象曲线预览"></svg>
                <div id="weatherPreviewStats" class="weather-preview-stats" aria-label="气象统计">暂无气象数据</div>
              </div>
            </div>
          </div>

          <div id="timeResizeHandle" class="time-resize-handle" role="separator" tabindex="0" aria-label="调整时序图高度" aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="520" aria-valuenow="0"></div>

          <div class="table-card">
            <div class="time-table-toolbar">
              <div id="monthTabs" class="month-tabs" aria-label="小时级数据月份分页"></div>
              <span id="pageInfo" class="page-info">未加载</span>
            </div>
            <div id="timeTable" class="data-table"></div>
          </div>
        </section>

        <section id="devicesTab" class="tab-panel">
          <div class="device-filter-card">
            <div class="device-filter-row">
              <div id="deviceFilters" class="device-filters" aria-label="设备类型显示筛选"></div>
              <div id="deviceJump" class="device-jump" aria-label="设备参数快捷跳转"></div>
            </div>
          </div>
          <div id="deviceTables" class="device-tables"></div>
        </section>

        <section id="planningTab" class="tab-panel">
          <div class="planning-parameters-card">
            <div id="planningParametersTable" class="data-table planning-parameters-table"></div>
          </div>
        </section>

        <section id="limitsTab" class="tab-panel">
          <div class="summary-page">
            <section class="summary-section summary-switcher">
              <div class="summary-tabs" role="tablist" aria-label="方案概览详情切换">
                <button class="summary-tab active" type="button" data-summary-tab="charts" aria-controls="summaryChartsPanel" aria-selected="true">统计直方图</button>
                <button class="summary-tab" type="button" data-summary-tab="devices" aria-controls="summaryDevicesPanel" aria-selected="false">待选设备列表</button>
                <button class="summary-tab" type="button" data-summary-tab="planning" aria-controls="summaryPlanningPanel" aria-selected="false">规划参数</button>
              </div>

              <div id="summaryChartsPanel" class="summary-tab-panel active" role="tabpanel" data-summary-panel="charts">
                <div class="panel-heading"><h2>统计直方图</h2></div>
                <div id="summaryCharts" class="histogram-grid"></div>
              </div>

              <div id="summaryDevicesPanel" class="summary-tab-panel" role="tabpanel" data-summary-panel="devices" hidden>
                <div class="panel-heading"><h2>待选设备列表</h2></div>
                <div id="quantitySummary" class="data-table"></div>
              </div>

              <div id="summaryPlanningPanel" class="summary-tab-panel" role="tabpanel" data-summary-panel="planning" hidden>
                <div class="panel-heading"><h2>规划参数</h2></div>
                <div id="planningSummary" class="data-table planning-parameters-table"></div>
              </div>
            </section>
          </div>
        </section>
      </section>

      <aside class="summary-rail">
        <div class="rail-title">校验与摘要</div>
        <div id="schemeSummary" class="summary-box"></div>
        <div id="validationList" class="validation-list"></div>
      </aside>
    </section>
  </main>
  <script src="assets/i18n.js?v=20260529-curve-generator"></script>
  <script src="assets/auth.js?v=20260510-auth"></script>
  <script src="assets/page_state.js?v=20260530-page-state2"></script>
  <script src="assets/planning.js?v=20260706-storage-balance-wind-forming"></script>
</body>
</html>
