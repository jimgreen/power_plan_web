<!doctype html>
<html lang="zh-CN" data-theme="precision-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>综合简报 - 考察站风-光-氢-储-柴联合规划系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/planning.css?v=20261127-ui-v26">
  <link rel="stylesheet" href="assets/ui-theme.css?v=20261127-ui-v26">
  <script src="assets/ui-kit.js?v=20261127-ui-v26"></script>
</head>
<body>
  <main class="planning-shell report-shell">
    <header class="topbar no-print">
      <a class="brand" href="index.html">考察站风-光-氢-储-柴联合规划系统</a>
      <nav class="main-nav" aria-label="主功能导航">
        <a href="index.html">系统首页</a>
        <a href="planning.html">参数维护</a>
        <a href="optimize.html">规划求解</a>
        <a href="evaluation.html">方案评估</a>
        <a href="reliability.html">供电可靠性</a>
        <a href="frequency.html">频率计算</a>
        <a href="comparison.html">结果对比</a>
        <a href="tasks.html">任务并发</a>
      </nav>
      <div class="user-status" data-auth-user hidden>
        <strong data-auth-username></strong><em data-auth-role></em>
        <button type="button" data-logout>退出</button>
      </div>
    </header>

    <div class="report-scroll-body">
      <article id="reportCanvas" class="report-canvas">
        <header class="report-doc-head">
          <div class="report-head-left no-print">
            <select id="reportSchemeSelect" aria-label="选择规划方案"></select>
            <select id="reportFileSelect" aria-label="选择求解结果文件"></select>
          </div>
          <div class="report-print-head print-only">
            <h1 id="reportTitle">方案综合评审简报</h1>
            <div id="reportSubtitle" class="report-doc-meta">—</div>
          </div>
          <div class="report-head-right">
            <span id="reportGeneratedAt" class="report-doc-time">—</span>
            <button id="reportPrintBtn" class="primary no-print" type="button">打印 / 导出 PDF</button>
          </div>
        </header>

        <div id="reportStaleHost"></div>
        <section id="reportKpiStrip" class="report-kpi-strip"></section>
        <section id="reportConclusionsCard" class="report-card report-conclusions-card" hidden>
          <h2>工程诊断结论与改进建议</h2>
          <div id="reportConclusionsList" class="report-conclusions-list"></div>
        </section>

        <section class="report-grid-two">
          <div class="report-card">
            <h2>站点负荷与资源概况</h2>
            <div id="reportSiteTable" class="data-table"></div>
          </div>
          <div class="report-card">
            <h2>规划装机容量配置</h2>
            <div id="reportCapacityTable" class="data-table"></div>
          </div>
        </section>

        <section class="report-card">
          <div class="insight-card-head">
            <h2>月度供能结构与电量平衡</h2>
            <div class="insight-card-controls no-print">
              <button id="reportMonthlyPng" type="button" class="insight-export-btn">PNG</button>
              <button id="reportMonthlySvg" type="button" class="insight-export-btn">SVG</button>
            </div>
          </div>
          <div class="insight-svg-stage">
            <svg id="reportMonthlyChart" class="report-monthly-chart" role="img" aria-label="月度供能结构图"></svg>
            <div id="reportMonthlyTip" class="insight-tooltip" hidden></div>
          </div>
        </section>

        <section class="report-grid-two report-insights-row">
          <div id="reportSankeyCard" class="report-card"></div>
          <div id="reportWaterfallCard" class="report-card"></div>
        </section>

        <section class="report-grid-three">
          <div class="report-card">
            <h2>经济性与绿电指标</h2>
            <div id="reportGreenTable" class="data-table"></div>
          </div>
          <div class="report-card">
            <h2>频率与运行安全指标</h2>
            <div id="reportSafetyTable" class="data-table"></div>
          </div>
          <div class="report-card">
            <h2>供电可靠性校核结论</h2>
            <div id="reportReliabilityTable" class="data-table"></div>
          </div>
        </section>
      </article>
    </div>
  </main>

  <script src="assets/i18n.js?v=20261127-ui-v26"></script>
  <script src="assets/auth.js?v=20261127-ui-v26"></script>
  <script src="assets/page_state.js?v=20261127-ui-v26"></script>
  <script src="assets/chart-enhancer.js?v=20261127-ui-v26"></script>
  <script src="assets/report.js?v=20261127-ui-v26"></script>
</body>
</html>
