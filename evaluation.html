<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方案评估 - 考察站风-光-氢-储-柴联合规划系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/planning.css?v=20260514-i18n">
</head>
<body>
  <main class="planning-shell">
    <header class="topbar">
      <a class="brand" href="index.html">考察站风-光-氢-储-柴联合规划系统</a>
      <nav class="main-nav" aria-label="主功能导航">
        <a href="index.html">系统首页</a>
        <a href="planning.html">参数维护</a>
        <a href="optimize.html">规划求解</a>
        <a class="active" href="evaluation.html">方案评估</a>
        <a href="users.html" data-admin-only hidden>用户管理</a>
        <a href="comparison.html">结果对比</a>
        <a href="tasks.html">任务并发</a>
      </nav>
      <div class="user-status" data-auth-user hidden>
        <span>当前用户:</span><strong data-auth-username></strong><em data-auth-role></em>
        <button type="button" data-logout>退出</button>
      </div>
    </header>

    <section class="workspace optimization-workspace evaluation-workspace">
      <aside class="scheme-rail">
        <div class="scheme-list-title">方案列表</div>
        <div id="schemeList" class="scheme-list"></div>
      </aside>

      <aside class="evaluation-result-rail">
        <div id="evaluationCurrentScheme" class="scheme-list-title">当前方案: 未选择方案</div>
        <div class="evaluation-result-actions" aria-label="结果文件管理">
          <select id="evaluationResultSelect" aria-label="结果文件列表"></select>
          <div id="evaluationResultWarnings" class="result-file-warnings" hidden></div>
          <div class="evaluation-result-action-buttons">
            <button id="deleteEvaluationResult" type="button">删除结果</button>
            <button id="copyEvaluationResult" type="button">复制结果</button>
            <button id="saveEvaluationResult" type="button">保存结果</button>
          </div>
        </div>
        <section class="evaluation-planning-result-panel" aria-label="当前规划结果">
          <div class="evaluation-planning-result-title">当前规划结果</div>
          <div id="evaluationPlanningResultTable" class="data-table evaluation-planning-result-table"></div>
        </section>
      </aside>

      <div id="evaluationMainResizeHandle" class="evaluation-main-resize-handle" role="separator" tabindex="0" aria-label="调整结果显示和评估面板宽度" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="620" aria-valuenow="360"></div>

      <section class="optimization-panel">
        <section class="optimization-command-card">
          <div class="optimization-command-row">
            <div class="optimization-actions" aria-label="方案评估操作">
              <button id="startEvaluation" class="primary" type="button">启动评估</button>
              <button id="stopEvaluation" class="danger" type="button">停止评估</button>
            </div>
            <div id="optimizationCurrentScheme" class="optimization-current-scheme">当前方案: 未选择方案</div>
          </div>
          <div class="optimization-status-grid" aria-label="方案评估总体指标">
            <div class="status-tile"><span>当前状态</span><strong id="optimizationStatus">待启动</strong></div>
            <div class="status-tile"><span>启动时刻</span><strong id="optimizationStartTime">-</strong></div>
            <div class="status-tile"><span>结束时刻</span><strong id="optimizationEndTime">-</strong></div>
            <div class="status-tile"><span>综合评分</span><strong id="evaluationScore">-</strong></div>
            <div class="status-tile"><span>风险等级</span><strong id="evaluationRisk">-</strong></div>
          </div>
        </section>

        <section class="optimization-result-card">
          <div class="result-tabs" role="tablist" aria-label="方案评估结果切换">
            <button class="result-tab active" data-result-tab="overview" type="button" aria-selected="true">评估概览</button>
            <button class="result-tab" data-result-tab="green" type="button" aria-selected="false">经济性指标</button>
            <button class="result-tab" data-result-tab="safety" type="button" aria-selected="false">安全性指标</button>
          </div>
          <div id="overviewResult" class="result-panel active" data-result-panel="overview" role="tabpanel"></div>
          <div id="greenResult" class="result-panel" data-result-panel="green" role="tabpanel" hidden></div>
          <div id="safetyResult" class="result-panel" data-result-panel="safety" role="tabpanel" hidden></div>
        </section>

      </section>

      <div id="optimizationLogResizeHandle" class="optimization-log-resize-handle evaluation-log-resize-handle" role="separator" tabindex="0" aria-label="调整评估日志高度" aria-orientation="horizontal" aria-valuemin="120" aria-valuemax="520" aria-valuenow="0"></div>

      <section class="evaluation-log-region optimization-log-card">
        <div class="log-view-tabs" role="tablist" aria-label="评估运行信息切换">
          <button id="evaluationLogViewToggle" class="log-view-tab active" data-log-view="logs" type="button" aria-selected="true">评估日志</button>
          <button id="evaluationCurveViewToggle" class="log-view-tab" data-log-view="curves" type="button" aria-selected="false">曲线展示</button>
        </div>
        <div id="evaluationLogPanel" class="log-view-panel active" data-log-view-panel="logs">
          <div id="evaluationLogs" class="optimization-logs" aria-live="polite"></div>
        </div>
        <div id="evaluationCurvePanel" class="log-view-panel optimization-curve-panel" data-log-view-panel="curves" hidden>
          <aside id="evaluationCurveNameList" class="optimization-curve-name-list" aria-label="小时级曲线、日级统计、月度统计和年度统计列表"></aside>
          <div id="evaluationCurveChart" class="optimization-curve-chart"></div>
        </div>
      </section>
    </section>
  </main>
  <script src="assets/i18n.js?v=20260514-i18n"></script>
  <script src="assets/auth.js?v=20260510-auth"></script>
  <script src="assets/result_curves.js?v=20260514-i18n"></script>
  <script src="assets/evaluation.js?v=20260514-i18n"></script>
</body>
</html>
