<!doctype html>
<html lang="zh-CN" data-theme="precision-dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>批量扫参 - 考察站风-光-氢-储-柴联合规划系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/planning.css?v=20261127-ui-v31">
  <link rel="stylesheet" href="assets/ui-theme.css?v=20261127-ui-v31">
  <script src="assets/ui-kit.js?v=20261127-ui-v31"></script>
</head>
<body>
  <main class="planning-shell">
    <header class="topbar">
      <a class="brand" href="index.html">考察站风-光-氢-储-柴联合规划系统</a>
      <nav class="main-nav" aria-label="主功能导航">
        <a href="index.html">系统首页</a>
        <a href="planning.html">参数维护</a>
        <a href="optimize.html">规划求解</a>
        <a href="evaluation.html">方案评估</a>
        <a href="reliability.html">供电可靠性</a>
        <a href="frequency.html">频率计算</a>
        <a href="comparison.html">结果对比</a>
        <a href="tasks.html">任务并发</a>
      </nav>
      <div class="user-status" data-auth-user hidden>
        <strong data-auth-username></strong><em data-auth-role></em>
        <button type="button" data-logout>退出</button>
      </div>
    </header>

    <section class="workspace sensitivity-workspace">
      <aside class="scheme-rail sensitivity-config-rail">
        <div class="scheme-list-title">
          <span>批量扫参配置</span>
          <a class="task-view-link" href="report.html">综合简报</a>
        </div>
        <div class="sens-form">
          <label class="sens-field">
            <span>基准方案</span>
            <select id="sensBaseScheme"></select>
          </label>
          <label class="sens-field">
            <span>扫描参数</span>
            <select id="sensParamKey">
              <option value="load_scale">负荷缩放系数 (倍)</option>
              <option value="wind_scale">风速缩放系数 (倍)</option>
              <option value="solar_scale">辐照缩放系数 (倍)</option>
              <option value="diesel_price">柴油单价 (元/kg)</option>
              <option value="green_power_ratio_lower">绿电占比下限 (0-1)</option>
              <option value="storage_cost_scale">储能造价系数 (倍)</option>
            </select>
          </label>
          <div class="sens-field">
            <span>快速档位</span>
            <div id="sensPresetChips" class="sens-preset-chips"></div>
          </div>
          <label class="sens-field">
            <span>扫描序列（逗号分隔，最多 12 档）</span>
            <input id="sensValuesInput" type="text" value="0.8, 0.9, 1.0, 1.1, 1.2">
          </label>
          <label class="sens-field">
            <span>第二扫描参数（可选，启用二维矩阵扫参）</span>
            <select id="sensParamKey2">
              <option value="">不启用（单参数扫描）</option>
              <option value="load_scale">负荷缩放系数 (倍)</option>
              <option value="wind_scale">风速缩放系数 (倍)</option>
              <option value="solar_scale">辐照缩放系数 (倍)</option>
              <option value="diesel_price">柴油单价 (元/kg)</option>
              <option value="green_power_ratio_lower">绿电占比下限 (0-1)</option>
              <option value="storage_cost_scale">储能造价系数 (倍)</option>
            </select>
          </label>
          <label class="sens-field" id="sensValues2Wrap" hidden>
            <span>第二参数序列（最多 6 档，总组合 ≤ 24）</span>
            <input id="sensValues2Input" type="text" value="0.8, 1.0, 1.2">
          </label>
          <label class="sens-field">
            <span>情景命名前缀</span>
            <input id="sensPrefixInput" type="text" placeholder="自动按基准方案生成">
          </label>
          <label class="sens-checkbox">
            <input id="sensAutoQueue" type="checkbox" checked>
            <span>生成后自动加入规划求解队列</span>
          </label>
          <div class="sens-actions">
            <button id="sensGenerateBtn" class="primary" type="button">生成并排队</button>
            <button id="sensRefreshBtn" type="button">刷新结果</button>
          </div>
        </div>

        <div class="sens-existing-block">
          <div class="scheme-list-title">
            <span>已跟踪情景组</span>
            <span id="sensTrackedCount" class="scheme-count-badge">0</span>
          </div>
          <div id="sensSchemePicker" class="sens-scheme-picker"></div>
          <div class="sens-actions">
            <button id="sensRetryFailedBtn" type="button">重试待算/失败</button>
            <button id="sensCompareAllBtn" type="button">加入结果对比</button>
            <button id="sensCleanupBtn" class="danger" type="button">批量清理</button>
          </div>
        </div>
      </aside>

      <section class="optimization-panel sensitivity-main-panel">
        <section class="optimization-command-card">
          <div class="optimization-command-row sens-single-row">
            <div class="sens-chart-controls">
              <button type="button" class="active" data-sens-view="trend" aria-pressed="true" title="敏感性曲线">曲线</button>
              <button type="button" data-sens-view="pareto" aria-pressed="false" title="Pareto 前沿">Pareto</button>
              <button type="button" data-sens-view="tornado" aria-pressed="false" title="龙卷风图">龙卷风</button>
              <select id="sensMetricSelect" aria-label="曲线指标">
                <option value="lcoe">度电成本</option>
                <option value="annual_cost">年均总成本</option>
                <option value="green_ratio">绿电占比</option>
                <option value="diesel_fuel">柴发耗油</option>
                <option value="curtail_rate">弃电率</option>
              </select>
              <div class="sens-export-hub">
                <button type="button" class="sens-export-trigger" aria-haspopup="true">导出</button>
                <div class="sens-export-popover" role="toolbar" aria-label="导出格式">
                  <button id="sensExportPngBtn" type="button">PNG</button>
                  <button id="sensExportSvgBtn" type="button">SVG</button>
                  <button id="sensExportCsvBtn" type="button">CSV</button>
                </div>
              </div>
            </div>
            <div class="optimization-status-grid">
              <div class="status-tile" title="情景总数"><span>情景</span><strong id="sensStatTotal">0</strong></div>
              <div class="status-tile" title="已完成计算"><span>完成</span><strong id="sensStatDone">0</strong></div>
              <div class="status-tile" title="最低度电成本 (元/kWh)"><span>LCOE</span><strong id="sensStatMinLcoe">—</strong></div>
              <div class="status-tile" title="最高绿电占比"><span>绿电</span><strong id="sensStatMaxGreen">—</strong></div>
            </div>
          </div>
        </section>

        <section class="sens-chart-card">
          <svg id="sensChartSvg" class="sens-chart-svg" role="img" aria-label="敏感性分析图表"></svg>
          <div id="sensChartTip" class="sens-chart-tip" hidden></div>
        </section>

        <section class="sens-table-card">
          <div id="sensSummaryTable" class="data-table"></div>
        </section>
      </section>
    </section>
  </main>

  <script src="assets/i18n.js?v=20261127-ui-v31"></script>
  <script src="assets/auth.js?v=20261127-ui-v31"></script>
  <script src="assets/page_state.js?v=20261127-ui-v31"></script>
  <script src="assets/chart-enhancer.js?v=20261127-ui-v31"></script>
  <script src="assets/sensitivity.js?v=20261127-ui-v31"></script>
</body>
</html>
