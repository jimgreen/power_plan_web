  <script>
    (() => {
      const STORAGE_KEY = "powerPlanHomeTheme";
      const THEMES = new Set([
        "default",
        "fresh",
        "bright",
        "sci-fi",
        "solemn",
        "minimal",
        "dark",
        "illustration",
        "flat",
        "neon-future",
        "glassmorphism",
        "material",
        "magazine",
        "dynamic",
      ]);
      const screen = document.querySelector(".screen");
      const select = document.getElementById("homeThemeSelect");

      function normalizeHomeTheme(value) {
        return THEMES.has(value) ? value : "default";
      }

      function readStoredHomeTheme() {
        try {
          return localStorage.getItem(STORAGE_KEY) || "default";
        } catch (error) {
          return "default";
        }
      }

      function applyHomeTheme(value) {
        const theme = normalizeHomeTheme(value);
        if (screen) screen.dataset.homeTheme = theme;
        document.documentElement.dataset.homeTheme = theme;
        document.body.dataset.homeTheme = theme;
        if (select) select.value = theme;
        try {
          localStorage.setItem(STORAGE_KEY, theme);
        } catch (error) {
          // 浏览器禁用本地存储时只保持本次页面选择。
        }
      }

      applyHomeTheme(readStoredHomeTheme());
      select?.addEventListener("change", (event) => applyHomeTheme(event.target.value));
    })();
  </script>
