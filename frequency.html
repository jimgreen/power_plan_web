<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>频率计算 - 考察站风-光-氢-储-柴联合规划系统</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/planning.css?v=20260530-scheme-rail-divider">
</head>
<body>
  <main class="planning-shell">
    <header class="topbar">
      <a class="brand" href="index.html">考察站风-光-氢-储-柴联合规划系统</a>
      <nav class="main-nav" aria-label="主功能导航">
        <a href="index.html">系统首页</a>
        <a href="planning.html">参数维护</a>
        <a href="optimize.html">规划求解</a>
        <a href="evaluation.html">方案评估</a>
        <a class="active" href="frequency.html">频率计算</a>
        <a href="comparison.html">结果对比</a>
        <a href="tasks.html">任务并发</a>
      </nav>
      <div class="user-status" data-auth-user hidden>
        <span>当前用户:</span><strong data-auth-username></strong><em data-auth-role></em>
        <button type="button" data-logout>退出</button>
      </div>
    </header>

    <section class="workspace optimization-workspace evaluation-workspace frequency-workspace">
      <aside class="scheme-rail">
        <div class="scheme-list-title">方案列表</div>
        <div id="schemeList" class="scheme-list"></div>
      </aside>
      <div id="frequencySchemeListResizeHandle" class="scheme-list-resize-handle" role="separator" tabindex="0" aria-label="调整左侧树高度" aria-orientation="horizontal" aria-valuemin="150" aria-valuemax="720" aria-valuenow="0"></div>

      <aside class="evaluation-result-rail">
        <section class="evaluation-planning-result-panel" aria-label="当前结果">
          <div id="frequencySummaryTitle" class="evaluation-planning-result-title">当前结果:未选择结果</div>
          <div id="frequencySummaryTable" class="data-table evaluation-planning-result-table"></div>
        </section>
        <div class="evaluation-result-actions" aria-label="结果文件状态">
          <div id="frequencyResultWarnings" class="result-file-warnings" hidden></div>
        </div>
      </aside>

      <div id="frequencyMainResizeHandle" class="evaluation-main-resize-handle" role="separator" tabindex="0" aria-label="调整结果显示和频率计算面板宽度" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="620" aria-valuenow="360"></div>

      <section class="optimization-panel">
        <section class="optimization-command-card">
          <div class="optimization-command-row">
            <div id="frequencyCurrentScheme" class="optimization-current-scheme">当前: 未选择方案/未选择结果</div>
            <div class="optimization-actions" aria-label="频率计算操作">
              <button id="startFrequency" class="primary" type="button">启动</button>
              <button id="queueFrequency" class="queue-action" type="button">排队</button>
              <button id="stopFrequency" class="danger" type="button">停止</button>
            </div>
            <div class="optimization-status-grid" aria-label="频率计算总体指标">
              <div class="status-tile"><span>状态</span><strong id="frequencyStatus">待启动</strong></div>
              <div class="status-tile"><span>开始</span><strong id="frequencyStartTime">-</strong></div>
              <div class="status-tile"><span>完成</span><strong id="frequencyEndTime">-</strong></div>
              <div class="status-tile"><span>最低频率</span><strong id="frequencyMin">-</strong></div>
              <div class="status-tile"><span>最高频率</span><strong id="frequencyMax">-</strong></div>
            </div>
          </div>
        </section>

        <section class="optimization-result-card">
          <div class="result-tabs" role="tablist" aria-label="频率计算结果切换">
            <button id="frequencyLogViewToggle" class="result-tab" data-result-tab="logs" type="button" aria-selected="false">评估日志</button>
            <button class="result-tab active" data-result-tab="metrics" type="button" aria-selected="true">频率指标</button>
            <button class="result-tab" data-result-tab="curve" type="button" aria-selected="false">分时曲线</button>
          </div>
          <div id="frequencyLogPanel" class="result-panel optimization-log-result-panel" data-result-panel="logs" role="tabpanel" hidden>
            <div id="frequencyLogs" class="optimization-logs" aria-live="polite"></div>
          </div>
          <div id="frequencyMetricsPanel" class="result-panel active" data-result-panel="metrics" role="tabpanel">
            <div class="frequency-metrics-layout">
              <div id="frequencyMetricsTable" class="data-table safety-result-table"></div>
              <div id="frequencyMetricsResizeHandle" class="result-column-resize-handle" role="separator" tabindex="0" aria-label="调整频率指标表和8760点曲线宽度" aria-orientation="vertical"></div>
              <div id="frequency8760CurveBoard" class="frequency-8760-curve-board" aria-label="8760点频率指标曲线"></div>
            </div>
          </div>
          <div id="frequencyCurvePanel" class="result-panel" data-result-panel="curve" role="tabpanel" hidden>
            <section class="frequency-time-curve-panel" aria-label="分时曲线">
              <div class="frequency-time-controls" aria-label="分时曲线时刻选择">
                <label>月/日<input id="frequencyCurveDate" type="date"></label>
                <label>时<input id="frequencyCurveHour" type="number" min="0" max="23" inputmode="numeric"></label>
                <button id="frequencyCurveQuery" class="primary" type="button">查询</button>
              </div>
              <div class="frequency-time-result-layout">
                <div id="frequencyTimeInfoTable" class="data-table safety-result-table"></div>
                <div id="frequencyTimeResultResizeHandle" class="result-column-resize-handle" role="separator" tabindex="0" aria-label="调整该时刻指标表和分时曲线宽度" aria-orientation="vertical"></div>
                <div id="frequencyCurveChart" class="safety-chart-viewport frequency-time-curve-chart"></div>
              </div>
            </section>
          </div>
        </section>
      </section>
    </section>
  </main>
  <script src="assets/i18n.js?v=20260518-fit-text4"></script>
  <script src="assets/auth.js?v=20260510-auth"></script>
  <script src="assets/frequency.js?v=20260530-scheme-rail-divider"></script>
</body>
</html>
